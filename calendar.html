<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="學測">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>學測倒數行事曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --paper:#EFF2F5;
  --surface:#FFFFFF;
  --surface-2:#F7F9FB;
  --ink:#131C26;
  --ink-2:#4E5C6B;
  --ink-3:#8A98A6;
  --line:#DBE2E9;
  --line-2:#C6D0DA;
  --accent:#B3122E;
  --accent-ink:#B3122E;
  --accent-wash:#FBEAEC;
  --weekend:#E9EDF2;
  --tickmark:#FFFFFF;
  --on-ev:#FFFFFF;
  --shadow:0 1px 2px rgba(19,28,38,.06),0 8px 24px rgba(19,28,38,.08);
  --ch:#9A5B12; --en:#1A6595; --ma:#5B3FA8; --sc:#166B56; --po:#8E2F63; --ot:#5B6875;
  --mid:#C2570B;  --mid-w:#FBEDE0;
  --mock:#3B4FA8; --mock-w:#E9ECFA;
  --lis:#0B6E85;  --lis-w:#E0F0F4;
  --gsat:#B3122E; --gsat-w:#FBE3E7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E141A;
    --surface:#161F28;
    --surface-2:#1B2531;
    --ink:#E5ECF3;
    --ink-2:#9FAEBC;
    --ink-3:#6E7E8D;
    --line:#26323E;
    --line-2:#35434F;
    --accent:#FF5C71;
    --accent-ink:#FF7C8C;
    --accent-wash:#301820;
    --weekend:#1A242E;
    --tickmark:#0E141A;
    --on-ev:#0E141A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --ch:#E0A05A; --en:#68B4E2; --ma:#A98CF0; --sc:#54C3A2; --po:#EB86B4; --ot:#93A3B2;
    --mid:#F2A057;  --mid-w:#33220F;
    --mock:#8FA0F5; --mock-w:#1B2044;
    --lis:#4FC0D9;  --lis-w:#0F2B33;
    --gsat:#FF5C71; --gsat-w:#361A21;
  }
}
:root[data-theme="dark"]{
  --paper:#0E141A;
  --surface:#161F28;
  --surface-2:#1B2531;
  --ink:#E5ECF3;
  --ink-2:#9FAEBC;
  --ink-3:#6E7E8D;
  --line:#26323E;
  --line-2:#35434F;
  --accent:#FF5C71;
  --accent-ink:#FF7C8C;
  --accent-wash:#301820;
  --weekend:#1A242E;
  --tickmark:#0E141A;
  --on-ev:#0E141A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --ch:#E0A05A; --en:#68B4E2; --ma:#A98CF0; --sc:#54C3A2; --po:#EB86B4; --ot:#93A3B2;
  --mid:#F2A057;  --mid-w:#33220F;
  --mock:#8FA0F5; --mock-w:#1B2044;
  --lis:#4FC0D9;  --lis-w:#0F2B33;
  --gsat:#FF5C71; --gsat-w:#361A21;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* event kinds */
.k-mid{--ev:var(--mid);--ev-w:var(--mid-w)}
.k-mock{--ev:var(--mock);--ev-w:var(--mock-w)}
.k-lis{--ev:var(--lis);--ev-w:var(--lis-w)}
.k-gsat{--ev:var(--gsat);--ev-w:var(--gsat-w)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.hwrap{max-width:1080px;margin:0 auto;padding:11px 16px 0}
.htop{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{flex:1 1 200px;min-width:0}
h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:19px;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub1{margin-top:1px;color:var(--ink-2);font-size:12.5px}
.sub1 b{color:var(--accent-ink)}
.count{text-align:right;line-height:1}
.count .big{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:38px;color:var(--accent-ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.count .lab{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.14em;margin-top:2px}

.bar{margin:10px 0 8px;height:5px;background:var(--weekend);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meta{display:flex;gap:13px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.meta b{color:var(--ink-2);font-weight:600}
.meta .latebtn{font-size:11.5px;color:var(--surface);background:var(--accent);
  border-radius:99px;padding:2px 10px;font-weight:500}
.meta .latebtn:hover{filter:brightness(1.1)}
.views .cnt{display:inline-block;min-width:1.5em;margin-left:4px;padding:0 5px;border-radius:99px;
  font-size:10.5px;font-weight:700;line-height:1.55;background:var(--accent);color:var(--surface);
  font-family:"IBM Plex Mono",monospace}
.views button[aria-pressed="true"] .cnt{background:var(--surface);color:var(--ink)}

/* 跳到今天：今天不在畫面上時才浮出來 */
.fab{position:fixed;right:16px;bottom:18px;z-index:35;display:flex;align-items:center;gap:6px;
  padding:9px 14px 9px 12px;border-radius:99px;background:var(--ink);color:var(--surface);
  font-size:13px;font-weight:500;box-shadow:var(--shadow);
  transform:translateY(0);opacity:1;transition:transform .18s ease,opacity .18s ease}
.fab .d{font-family:"IBM Plex Mono",monospace;font-size:12px;opacity:.75}
.fab .arrow{font-size:14px;line-height:1}
.fab.off{transform:translateY(12px);opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){.fab{transition:none}}

/* 未完成檢視 */
.odsum{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 14px;padding:12px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px}
.odsum .big{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;color:var(--accent-ink);line-height:1}
.odsum .lab{font-size:12.5px;color:var(--ink-2)}
.odsum .split{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.odsum .split b{color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.odsec{font-family:"Noto Serif TC",serif;font-size:14px;font-weight:600;margin:18px 0 8px;
  display:flex;align-items:baseline;gap:8px}
.odsec .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);font-weight:500}
.odgroup{margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.odgroup.late{box-shadow:inset 4px 0 0 var(--accent)}
.odhead{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;
  padding:7px 12px 7px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.odhead:hover .open{color:var(--accent-ink)}
.odhead .dt{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600}
.odhead .wd{font-size:11.5px;color:var(--ink-3)}
.odhead .ago{font-size:11px;font-weight:700;color:var(--accent-ink)}
.odhead .ago.today{color:var(--surface);background:var(--accent);border-radius:3px;padding:0 5px}
.odhead .open{margin-left:auto;font-size:11px;color:var(--ink-3)}
.odbody{padding:6px 12px 8px 14px;display:flex;flex-direction:column;gap:4px}
.odempty{padding:40px 16px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.8}
.odempty b{display:block;font-family:"Noto Serif TC",serif;font-size:18px;color:var(--ink);margin-bottom:4px}

.exams{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.exch{
  flex:none;display:inline-flex;align-items:center;gap:6px;padding:3px 5px 3px 3px;
  border:1px solid var(--ev);border-radius:7px;background:var(--ev-w);white-space:nowrap;
}
.exch .nm{background:var(--ev);color:var(--on-ev);font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px}
.exch .dt{font-size:10.5px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.exch .dd{font-size:10.5px;color:var(--ev);font-weight:700;font-family:"IBM Plex Mono",monospace}
.exch.past{opacity:.4}

.hbot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:10px}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1 1 auto}
.chip{display:inline-flex;align-items:baseline;gap:4px;padding:3px 8px;border-radius:99px;
  border:1px solid var(--line);font-size:12px;line-height:1.4;background:var(--surface-2)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c);align-self:center;flex:none}
.chip .pct{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.chip[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--c)}
.chip.dim{opacity:.42}
.views{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.views button{padding:4px 11px;font-size:12px;color:var(--ink-2)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* ---------- body ---------- */
main{max-width:1080px;margin:0 auto;padding:18px 16px 96px}
.month{margin-bottom:26px}
.mhead{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.mhead h2{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:600;margin:0}
.mhead .sub{font-size:11.5px;color:var(--ink-3)}

.wnum{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--ink-3)}
.wtype{font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.wtype.t-review{border-color:var(--mid);border-style:dashed;color:var(--mid);background:transparent}
.wtype.t-midterm{border-color:var(--mid);color:var(--mid);background:var(--mid-w)}
.wtype.t-exam{border-color:var(--gsat);color:var(--gsat);background:var(--gsat-w)}
.wtype.t-off{border-color:var(--line-2);color:var(--ink-3);font-style:italic}
.wev{font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--ev);color:var(--on-ev);font-weight:700;white-space:nowrap}

/* list view */
.wgroup{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.wbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.w-review .wbar,.w-midterm .wbar{background:var(--mid-w)}
.w-exam .wbar{background:var(--gsat-w)}
.w-review .wbar{border-bottom-style:dashed;border-bottom-color:var(--mid)}
.grail.w-review,.grail.w-midterm{background:var(--mid-w)}
.grail.w-exam{background:var(--gsat-w)}
.wbar .span{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.day{display:flex;gap:10px;padding:7px 10px;border-top:1px solid var(--line)}
.wgroup .day:first-of-type{border-top:none}
.day.we{background:var(--weekend)}
.day.ex{background:var(--ev-w);box-shadow:inset 4px 0 0 var(--ev)}
.day.tod .rail .dd{color:var(--accent-ink)}
/* 過去、已結清的日子退到背景；還有沒做完的則反過來跳出來 */
.day.past{opacity:.5}
.day.late{opacity:1;background:var(--accent-wash);box-shadow:inset 4px 0 0 var(--accent)}
.it.late .tick{border-color:var(--accent);background:var(--accent-wash)}
.it.late .tag{color:var(--accent-ink)}
.it.late .tx{color:var(--ink);font-weight:500}
.latetag{display:inline-block;font-size:9.5px;font-weight:700;color:var(--surface);
  background:var(--accent);border-radius:3px;padding:0 4px;margin-top:2px;
  line-height:1.6;white-space:nowrap;letter-spacing:.02em}
.day.prog{outline:2px dashed var(--mid);outline-offset:-3px;border-radius:7px}
.cell.prog{outline:2px dashed var(--mid);outline-offset:-2px}
.progtag{display:inline-block;font-size:9.5px;font-weight:700;color:var(--mid);
  border:1px dashed var(--mid);border-radius:3px;padding:0 3px;line-height:1.6;
  margin-top:2px;white-space:nowrap;letter-spacing:.02em}
.rail{flex:none;width:66px;display:flex;flex-direction:column;line-height:1.25;padding-top:1px}
.rail .dd{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.rail .wd{font-size:11px;color:var(--ink-3)}
.rail .dc{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.day.ex .rail .dc{color:var(--ev);font-weight:600}
.now{display:inline-block;font-size:9.5px;font-weight:700;color:var(--surface);background:var(--accent);
  border-radius:3px;padding:0 4px;margin-left:3px;vertical-align:2px;letter-spacing:.03em}
.dbody{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.evrow{display:inline-flex;align-items:center;gap:6px;margin-bottom:1px}
.evrow .nm{background:var(--ev);color:var(--on-ev);font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px}
.evrow .note{font-size:11px;color:var(--ev)}
.it{display:flex;gap:7px;align-items:baseline;width:100%;text-align:left;padding:1px 0}
.it .tick{flex:none;width:14px;height:14px;border:1.5px solid var(--c);border-radius:4px;align-self:center;position:relative;background:transparent}
.it.done .tick{background:var(--c)}
.it.done .tick::after{content:"";position:absolute;left:3.5px;top:.5px;width:3.5px;height:8px;
  border:solid var(--tickmark);border-width:0 2px 2px 0;transform:rotate(42deg)}
.it .tag{flex:none;font-size:10.5px;color:var(--c);font-weight:700;min-width:2.4em}
.it .tx{flex:1 1 auto;word-break:break-word;font-size:13px}
.it.done .tx{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.it.hide{display:none}
.addbtn{font-size:11.5px;color:var(--ink-3);padding:2px 8px;border:1px dashed var(--line-2);border-radius:6px;margin-top:2px}
.addbtn:hover{color:var(--accent-ink);border-color:var(--accent)}

/* grid view */
.grid{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.grow{display:grid;grid-template-columns:74px repeat(7,1fr);border-top:1px solid var(--line)}
.grid .grow:first-child{border-top:none}
.ghead{background:var(--surface-2);font-size:11px;color:var(--ink-3)}
.ghead>div{padding:5px 6px;text-align:center;border-left:1px solid var(--line)}
.ghead>div:first-child{border-left:none;text-align:left}
.grail{padding:6px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;background:var(--surface-2);font-size:11px}
.cell{border-left:1px solid var(--line);padding:4px 5px 6px;min-height:80px;
  display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;overflow:hidden}
.cell.we{background:var(--weekend)}
.cell.ex{background:var(--ev-w)}
.cell.out{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px);opacity:.4;cursor:default}
.cell.past{opacity:.45}
.cell.late{opacity:1;background:var(--accent-wash);box-shadow:inset 0 0 0 2px var(--accent)}
.cell .lateN{font-size:9.5px;font-weight:700;color:var(--surface);background:var(--accent);
  border-radius:3px;padding:0 4px;line-height:1.6;align-self:flex-start;margin:1px 0}
.cell.tod{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .n{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;line-height:1.2}
.cell.tod .n{color:var(--accent-ink)}
.cell .dcs{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);line-height:1.2}
.cell .evb{background:var(--ev);color:var(--on-ev);font-size:10px;font-weight:700;
  border-radius:4px;padding:1px 4px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ci{font-size:10.5px;line-height:1.35;color:var(--ink-2);border-left:2px solid var(--c);
  padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ci.done{color:var(--ink-3);text-decoration:line-through}
.cell .more{font-size:9.5px;color:var(--ink-3)}
@media(max-width:700px){
  .grow{grid-template-columns:46px repeat(7,1fr)}
  .cell{min-height:62px;padding:3px}
  .cell .ci{font-size:9.5px}
  .cell .evb{font-size:9px;padding:0 3px}
  .grail{padding:4px;gap:2px}
}

/* ---------- editor ---------- */
.scrim{position:fixed;inset:0;background:rgba(19,28,38,.34);z-index:40;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.ed{position:fixed;z-index:50;background:var(--surface);box-shadow:var(--shadow);
  display:flex;flex-direction:column;transition:transform .18s ease;
  right:0;top:0;bottom:0;width:min(380px,100%);border-left:1px solid var(--line);transform:translateX(101%)}
.ed.on{transform:none}
@media(max-width:860px){
  .ed{left:0;right:0;top:auto;bottom:0;width:auto;max-height:80vh;border-left:none;
      border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(101%)}
}
@media(prefers-reduced-motion:reduce){.ed,.scrim{transition:none}}
.edh{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.edh .dt{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:600;line-height:1.2}
.edh .dsub{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.edh .evtag{display:inline-block;background:var(--ev);color:var(--on-ev);font-family:"Noto Sans TC",sans-serif;
  font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:5px}
.nav{margin-left:auto;display:flex;gap:4px}
.nav button{width:28px;height:28px;border:1px solid var(--line);border-radius:7px;
  display:grid;place-items:center;color:var(--ink-2);font-size:13px}
.nav button:hover{border-color:var(--accent);color:var(--accent-ink)}
.wsel{display:flex;gap:5px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wsel .lb{font-size:11px;color:var(--ink-3);margin-right:2px}
.wsel button{font-size:11.5px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;color:var(--ink-2)}
.wsel button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.edform{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.picker{display:flex;gap:4px;flex-wrap:wrap}
.pk{padding:3px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);background:var(--surface-2)}
.pk[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on-ev);font-weight:500}
.inrow{display:flex;gap:6px}
.inrow input{flex:1 1 auto;min-width:0;font:inherit;font-family:inherit;font-size:13px;padding:7px 10px;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.inrow input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.inrow button{padding:0 14px;border-radius:8px;background:var(--ink);color:var(--surface);font-size:13px;font-weight:500}
.edlist{flex:1 1 auto;overflow-y:auto;padding:8px 14px 16px;min-height:80px}

":1},{"id":"m1b","t":"自然模模考","s":"sc","done":false,"p":1}],"2026-12-20":[{"id":"v2y","t":"每日單字進度","s":"en","done":false,"p":1},{"id":"s4o","t":"英文閱測 第 97 回","s":"en","done":false,"p":1},{"id":"s7g","t":"國文閱測 第 97 回","s":"ch","done":false,"p":1}],"2026-12-21":[{"id":"v2z","t":"每日單字進度","s":"en","done":false,"p":1},{"id":"s4p","t":"英文閱測 第 98 回","s":"en","done":false,"p":1},{"id":"s7h","t":"國文閱測 第 98 回","s":"ch","done":false,"p":1}],"2026-12-22":[{"id":"v30","t":"每日單字進度","s":"en","done":false,"p":1},{"id":"s4q","t":"英文閱測 第 99 回","s":"en","done":false,"p":1},{"id":"s7i","t":"國文閱測 第 99 回","s":"ch","done":false,"p":1}],"2026-12-23":[{"id":"v31","t":"每日單字進度","s":"en","done":false,"p":1},{"id":"s4r","t":"英文閱測 第 100 回","s":"en","done":false,"p":1},{"id":"s7j","t":"國文閱測 第 100 回","s":"ch","done":false,"p":1}],"2026-12-24":[{"id":"v32","t":"每日單字進度","s":"en","done":false,"p":1}],"2026-12-25":[{"id":"v33","t":"每日單字進度","s":"en","done":false,"p":1}],"2026-12-26":[{"id":"v34","t":"每日單字進度","s":"en","done":false,"p":1}],"2026-12-27":[{"id":"v35","t":"每日單字進度","s":"en","done":false,"p":1}],"2026-12-28":[{"id":"v36","t":"每日單字進度","s":"en","done":false,"p":1}],"2026-12-29":[{"id":"v37","t":"每日單字進度","s":"en","done":false,"p":1}],"2026-12-30":[{"id":"v38","t":"每日單字進度","s":"en","done":false,"p":1}],"2026-12-31":[{"id":"v39","t":"每日單字進度","s":"en","done":false,"p":1}]},"weeks":{"2026-08-31":"off"}};</script>
<script>
(function(){
"use strict";

/* ---------- constants ---------- */
var START="2026-09-05", TARGET="2027-01-22", END="2027-01-23";
var MONTHS=[["2026-09","九月"],["2026-10","十月"],["2026-11","十一月"],["2026-12","十二月"],["2027-01","一月"]];
var WD=["一","二","三","四","五","六","日"];
var SUBJ=[
  {k:"en",n:"英",full:"英文",pct:35,c:"var(--en)"},
  {k:"ma",n:"數A",full:"數學A",pct:25,c:"var(--ma)"},
  {k:"ch",n:"國",full:"國文",pct:15,c:"var(--ch)"},
  {k:"sc",n:"自",full:"自然",pct:15,c:"var(--sc)"},
  {k:"po",n:"歷程",full:"學習歷程",pct:10,c:"var(--po)"},
  {k:"ot",n:"其他",full:"其他",pct:0,c:"var(--ot)"}
];
var SM={}; SUBJ.forEach(function(s){SM[s.k]=s;});
var WTYPES=[["regular","常規週"],["review","段考複習週"],["midterm","段考週"],["exam","考試週"],["off","放假／彈性"]];
var WTM={}; WTYPES.forEach(function(w){WTM[w[0]]=w[1];});

var EXAMS=[
  {short:"一段",  full:"第一次段考", kind:"mid",  days:["2026-10-12","2026-10-13"]},
  {short:"英聽①", full:"第一次英聽", kind:"lis",  days:["2026-10-17"]},
  {short:"三模",  full:"第三次模擬考", kind:"mock", days:["2026-10-28","2026-10-29"]},
  {short:"二段",  full:"第二次段考", kind:"mid",  days:["2026-11-25","2026-11-26"]},
  {short:"四模",  full:"第四次模擬考", kind:"mock", days:["2026-12-08","2026-12-09"]},
  {short:"英聽②", full:"第二次英聽", kind:"lis",  days:["2026-12-12"]},
  {short:"期末",  full:"期末考",     kind:"mid",  days:["2026-12-30","2026-12-31"]},
  {short:"學測",  full:"學科能力測驗", kind:"gsat", days:["2027-01-22","2027-01-23"]}
];
var EV={};
EXAMS.forEach(function(x){
  x.days.forEach(function(d,i){
    EV[d]={short:x.short,full:x.full,kind:x.kind,part:i+1,of:x.days.length,first:x.days[0]};
  });
});

/* ---------- date helpers ---------- */
function D(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function key(d){
  var m=d.getMonth()+1,day=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function diff(a,b){return Math.round((D(b)-D(a))/86400000);}
function mondayOf(d){var x=new Date(d.getTime());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function col(d){return (d.getDay()+6)%7;}
function md(dk){return dk.slice(5).replace("-","/");}
var todayKey=(function(){
  var t=key(new Date());
  if(t<START)return START;
  if(t>END)return END;
  return t;
})();
var TOTAL=diff(START,TARGET);
var W1=mondayOf(D(START));
function weekKey(dk){return key(mondayOf(D(dk)));}
function weekNo(wk){return Math.round((D(wk)-W1)/604800000)+1;}
var LASTW=weekNo(weekKey(END));
function inRange(dk){return dk>=START&&dk<=END;}
// 段考進度：期末考前的每個禮拜日，整格框起來
var PROG_END="2026-12-27";
function isProg(dk){return dk<=PROG_END&&col(D(dk))===6;}
function dcLabel(dk){
  if(dk===TARGET)return "D-DAY";
  if(dk>TARGET)return "＋"+diff(TARGET,dk);
  return "D-"+diff(dk,TARGET);
}

/* ---------- state ---------- */
var state={days:{},weeks:{},view:"list",filter:null,open:null};
var db=null,dirty={},saveT=null;
var LS="xt-cal-v1";

function loadLocal(){
  try{
    var o=JSON.parse(localStorage.getItem(LS)||"{}");
    if(o.days)state.days=o.days;
    if(o.weeks)state.weeks=o.weeks;
    if(o.view)state.view=o.view;
  }catch(e){}
}
function saveLocal(){
  try{localStorage.setItem(LS,JSON.stringify({days:state.days,weeks:state.weeks,view:state.view}));}catch(e){}
}
function monthOf(dk){return dk.slice(0,7);}
function daysOfMonth(mk){
  var out={},k;
  for(k in state.days)if(state.days.hasOwnProperty(k)&&k.slice(0,7)===mk&&state.days[k].length)out[k]=state.days[k];
  return out;
}
function touch(mk){dirty[mk]=1;saveLocal();if(saveT)clearTimeout(saveT);saveT=setTimeout(flush,450);}
function flush(){
  saveT=null;
  if(!db)return;
  var pending=dirty;dirty={};
  Object.keys(pending).forEach(function(mk){
    var path=mk==="__weeks"?"plan/weeks":"plan/"+mk;
    var body=mk==="__weeks"?{weeks:state.weeks}:{days:daysOfMonth(mk)};
    db.doc(path).set(body)["catch"](function(e){
      setStatus(e&&e.code==="quota_exceeded"?"雲端空間已滿，先刪一些舊項目":"雲端同步失敗，資料仍留在這台裝置");
    });
  });
}
var statusT=null;
function setStatus(msg){
  var el=document.getElementById("_st");
  if(!el){el=document.createElement("div");el.className="status";el.id="_st";document.body.appendChild(el);}
  el.textContent=msg;
  if(statusT)clearTimeout(statusT);
  statusT=setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},5000);
}

/* ---------- week type ---------- */
function hasKind(wk,test){
  var i,e;
  for(i=0;i<7;i++){
    e=EV[key(addDays(D(wk),i))];
    if(e&&test(e.kind))return true;
  }
  return false;
}
function derivedType(wk){
  if(hasKind(wk,function(k){return k!=="mid";}))return "exam";
  if(hasKind(wk,function(k){return k==="mid";}))return "midterm";
  // 段考（含期末）的前一週 = 段考複習週
  if(hasKind(key(addDays(D(wk),7)),function(k){return k==="mid";}))return "review";
  return "regular";
}
function wtypeOfWeek(wk){
  var v=state.weeks[wk];
  if(v&&WTM[v])return v;
  return derivedType(wk);
}
function wtypeOf(dk){return wtypeOfWeek(weekKey(dk));}
function wtypeTag(wk){
  var t=wtypeOfWeek(wk);
  return '<span class="wtype t-'+t+'">'+WTM[t]+'</span>';
}
function weekEvents(wk){
  var out=[],i,dk,seen={};
  for(i=0;i<7;i++){
    dk=key(addDays(D(wk),i));
    if(EV[dk]&&!seen[EV[dk].short]){seen[EV[dk].short]=1;out.push(EV[dk]);}
  }
  return out;
}

/* ---------- 逾期：今天以前還沒打勾的 ---------- */
function lateOn(dk){
  if(dk>=todayKey)return 0;
  var a=state.days[dk]||[],c=0,i;
  for(i=0;i<a.length;i++)if(!a[i].done)c++;
  return c;
}
function overdue(){
  var n=0,first=null,dk;
  for(dk in state.days)if(state.days.hasOwnProperty(dk)&&dk<todayKey){
    var c=lateOn(dk);
    if(c){n+=c;if(!first||dk<first)first=dk;}
  }
  return {n:n,first:first};
}

/* ---------- header ---------- */
function renderHead(){
  var left=diff(todayKey,TARGET);
  document.getElementById("dbig").textContent=left>0?"D-"+left:(left===0?"D-DAY":"＋"+(-left));
  document.getElementById("pbar").style.width=(TOTAL?Math.max(0,Math.min(100,(TOTAL-left)/TOTAL*100)):0)+"%";
  var tot=0,dn=0,k,i,a;
  for(k in state.days)if(state.days.hasOwnProperty(k)){
    a=state.days[k];
    for(i=0;i<a.length;i++){tot++;if(a[i].done)dn++;}
  }
  var nextEx=null;
  for(i=0;i<EXAMS.length;i++){
    if(EXAMS[i].days[EXAMS[i].days.length-1]>=todayKey){nextEx=EXAMS[i];break;}
  }
  var od=overdue();
  document.getElementById("meta").innerHTML=
    '<span>第 <b class="mono">'+weekNo(weekKey(todayKey))+'</b> / '+LASTW+' 週</span>'+
    '<span>剩 <b class="mono">'+Math.max(0,Math.ceil(left/7))+'</b> 個週</span>'+
    (nextEx?'<span>下一場 <b>'+nextEx.short+'</b> <b class="mono">'+
      (diff(todayKey,nextEx.days[0])>0?"D-"+diff(todayKey,nextEx.days[0]):"就是今天")+'</b></span>':"")+
    '<span>已排 <b class="mono">'+tot+'</b> 項 · 完成 <b class="mono">'+dn+'</b></span>'+
    (od.n?'<button class="latebtn" id="btnLate">補做 <b class="mono">'+od.n+'</b> 項</button>':"");
  var bl=document.getElementById("btnLate");
  if(bl)bl.onclick=function(){setView("late");window.scrollTo(0,0);};
  var lc=document.getElementById("lateCnt");
  if(lc){lc.textContent=od.n;lc.hidden=!od.n;}
}

function renderExams(){
  var box=document.getElementById("exams");
  box.innerHTML="";
  EXAMS.forEach(function(x){
    var last=x.days[x.days.length-1], gone=last<todayKey;
    var n=diff(todayKey,x.days[0]);
    var b=document.createElement("button");
    b.className="exch k-"+x.kind+(gone?" past":"");
    b.title=x.full+"　"+x.days.map(md).join("、")+"　點一下跳到那天";
    b.innerHTML='<span class="nm">'+x.short+'</span><span class="dt">'+
      x.days.map(md).join("–")+'</span><span class="dd">'+
      (gone?"已過":(n>0?"D-"+n:(n===0?"今天":"進行中")))+'</span>';
    b.onclick=function(){gotoDay(x.days[0]);};
    box.appendChild(b);
  });
}

function renderChips(){
  var counts={},k,i,a;
  for(k in state.days)if(state.days.hasOwnProperty(k)){
    a=state.days[k];
    for(i=0;i<a.length;i++)counts[a[i].s]=(counts[a[i].s]||0)+1;
  }
  var box=document.getElementById("chips");
  box.innerHTML="";
  SUBJ.forEach(function(s){
    var b=document.createElement("button");
    b.className="chip"+(state.filter&&state.filter!==s.k?" dim":"");
    b.style.setProperty("--c",s.c);
    b.setAttribute("aria-pressed",state.filter===s.k?"true":"false");
    b.title=s.full+"　週時數配比目標 "+s.pct+"%　已排 "+(counts[s.k]||0)+" 項";
    b.innerHTML='<span class="dot"></span><span>'+s.n+'</span><span class="pct">'+(counts[s.k]||0)+'</span>';
    b.onclick=function(){state.filter=state.filter===s.k?null:s.k;renderChips();renderBody();};
    box.appendChild(b);
  });
}

/* ---------- body ---------- */
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function itemsOf(dk){return state.days[dk]||[];}

function renderBody(){
  // 重畫整份清單會讓捲動位置跳掉（打勾、篩選、雲端同步都會觸發），先記下再放回去
  var y=window.pageYOffset||document.documentElement.scrollTop||0;
  document.getElementById("main").innerHTML=
    state.view==="late"?lateHTML():state.view==="grid"?gridHTML():listHTML();
  if(y)window.scrollTo(0,y);
  updateFab();
}

/* ---------- 未完成檢視 ----------
   同一份 state，只是換個角度看：今天以前還沒打勾的，由舊到新。
   在這裡打勾的項目先留在畫面上（劃掉），免得手滑點錯找不回來；離開這個檢視再收掉。 */
var justDone={};
function lateHTML(){
  var keys=Object.keys(state.days).filter(function(k){return k<todayKey;}).sort();
  var groups=[],lateN=0,i,j;
  for(i=0;i<keys.length;i++){
    var dk=keys[i],arr=state.days[dk]||[],rows=[];
    for(j=0;j<arr.length;j++){
      var it=arr[j];
      if(state.filter&&it.s!==state.filter)continue;
      if(!it.done||justDone[it.id]){
        rows.push(it);
        if(!it.done)lateN++;
      }
    }
    if(rows.length)groups.push({dk:dk,rows:rows});
  }

  if(!groups.length){
    return '<div class="odempty"><b>全部清空了</b>今天以前的項目都打勾了。'+
           (state.filter?'<br>（目前只看「'+SM[state.filter].full+'」，取消篩選看全部）':'')+'</div>';
  }

  var days=groups.filter(function(g){return g.rows.some(function(x){return !x.done;});}).length;
  var html='<div class="odsum"><span class="big">'+lateN+'</span>'+
           '<span class="lab">項還沒做'+(state.filter?'（只看'+SM[state.filter].full+'）':'')+'</span>'+
           '<span class="split">分散在 <b>'+days+'</b> 天　由舊到新</span></div>';

  for(i=0;i<groups.length;i++){
    var g=groups[i],d=D(g.dk),ago=diff(g.dk,todayKey);
    var pending=g.rows.filter(function(x){return !x.done;}).length;
    html+='<div class="odgroup late">'+
      '<button class="odhead" data-d="'+g.dk+'" data-act="open">'+
        '<span class="dt">'+md(g.dk)+'</span><span class="wd">週'+WD[col(d)]+'</span>'+
        '<span class="ago">'+(ago===1?'昨天':ago+' 天前')+'</span>'+
        '<span class="open">'+pending+' 項 · 開這天 ›</span>'+
      '</button><div class="odbody">';
    for(j=0;j<g.rows.length;j++){
      var r=g.rows[j];
      html+='<button class="it'+(r.done?' done':' late')+'" style="--c:'+SM[r.s].c+
            '" data-d="'+g.dk+'" data-i="'+r.id+'" data-act="toggle" title="點一下＝完成／取消">'+
            '<span class="tick"></span><span class="tag">'+SM[r.s].n+'</span><span class="tx">'+esc(r.t)+'</span></button>';
    }
    html+='</div></div>';
  }
  return html;
}

/* ---------- 跳到今天（浮動按鈕） ---------- */
function updateFab(){
  var fab=document.getElementById("fab");
  if(!fab)return;
  if(state.view==="late"){fab.classList.add("off");return;}
  var el=document.querySelector('#main [data-d="'+todayKey+'"]');
  if(!el){fab.classList.add("off");return;}
  var r=el.getBoundingClientRect(),vh=window.innerHeight||document.documentElement.clientHeight;
  var head=document.querySelector("header");
  var top=head?head.getBoundingClientRect().bottom:0;
  var visible=r.bottom>top+20&&r.top<vh-20;
  fab.classList.toggle("off",visible);
  document.getElementById("fabArrow").textContent=r.top<top?"↑":"↓";
}

function dayItemsHTML(dk){
  var arr=itemsOf(dk),out="",i,it,hid,isPast=dk<todayKey;
  for(i=0;i<arr.length;i++){
    it=arr[i];
    hid=state.filter&&it.s!==state.filter;
    out+='<button class="it'+(it.done?" done":"")+(hid?" hide":"")+
         (isPast&&!it.done?" late":"")+'" style="--c:'+SM[it.s].c+
         '" data-d="'+dk+'" data-i="'+it.id+'" data-act="toggle" title="點一下＝完成／取消">'+
         '<span class="tick"></span><span class="tag">'+SM[it.s].n+'</span><span class="tx">'+esc(it.t)+'</span></button>';
  }
  return out;
}

function listHTML(){
  var html="",mi;
  for(mi=0;mi<MONTHS.length;mi++){
    var mk=MONTHS[mi][0];
    var first=mk+"-01", last=key(new Date(+mk.slice(0,4),+mk.slice(5,7),0));
    var from=first<START?START:first, to=last>END?END:last;
    if(from>to)continue;
    html+='<section class="month"><div class="mhead"><h2>'+MONTHS[mi][1]+'</h2>'+
          '<span class="sub mono">'+md(from)+' – '+md(to)+' · '+(diff(from,to)+1)+' 天</span></div>';
    var d=D(from),cur=null,open=false;
    while(key(d)<=to){
      var dk=key(d), wk=weekKey(dk);
      if(wk!==cur){
        if(open)html+="</div>";
        cur=wk;open=true;
        var evs=weekEvents(wk).map(function(e){
          return '<span class="wev k-'+e.kind+'">'+e.short+'</span>';
        }).join("");
        html+='<div class="wgroup w-'+wtypeOfWeek(wk)+'"><div class="wbar"><span class="wnum">W'+weekNo(wk)+'</span>'+
              wtypeTag(wk)+evs+'<span class="span">'+md(wk)+' – '+md(key(addDays(D(wk),6)))+'</span></div>';
      }
      var e=EV[dk], pg=isProg(dk), lt=lateOn(dk);
      var cls="day"+(col(d)>=5?" we":"")+(dk===todayKey?" tod":"")+(e?" ex k-"+e.kind:"")+(pg?" prog":"")+
              (dk<todayKey?(lt?" late":" past"):"");
      var evrow=e?'<div class="evrow"><span class="nm">'+e.full+'</span>'+
                 (e.of>1?'<span class="note">第 '+e.part+' / '+e.of+' 天</span>':"")+'</div>':"";
      html+='<div class="'+cls+'" data-d="'+dk+'"><div class="rail"><span class="dd">'+dk.slice(8)+
            (dk===todayKey?'<span class="now">今天</span>':"")+'</span><span class="wd">週'+WD[col(d)]+
            '</span><span class="dc">'+dcLabel(dk)+'</span>'+
            (lt?'<span class="latetag">未完成 '+lt+'</span>':"")+
            (pg?'<span class="progtag">段考進度</span>':"")+'</div><div class="dbody">'+evrow+dayItemsHTML(dk)+
            '<button class="addbtn" data-d="'+dk+'" data-act="open">＋ 排這天</button></div></div>';
      d=addDays(d,1);
    }
    if(open)html+="</div>";
    html+="</section>";
  }
  return html;
}

function gridHTML(){
  var html="",mi,w,i,j;
  for(mi=0;mi<MONTHS.length;mi++){
    var mk=MONTHS[mi][0];
    var y=+mk.slice(0,4), mo=+mk.slice(5,7);
    var first=new Date(y,mo-1,1), last=new Date(y,mo,0);
    if(key(last)<START||key(first)>END)continue;
    html+='<section class="month"><div class="mhead"><h2>'+MONTHS[mi][1]+'</h2><span class="sub mono">'+y+'</span></div><div class="grid">';
    html+='<div class="grow ghead"><div>週次</div>';
    for(w=0;w<7;w++)html+="<div>"+WD[w]+"</div>";
    html+="</div>";
    var d=mondayOf(first);
    while(d<=last){
      var wk=key(d);
      html+='<div class="grow"><div class="grail w-'+wtypeOfWeek(wk)+'"><span class="wnum">W'+weekNo(wk)+'</span>'+wtypeTag(wk)+'</div>';
      for(i=0;i<7;i++){
        var cd=addDays(d,i), dk=key(cd);
        if(cd.getMonth()!==mo-1||!inRange(dk)){html+='<div class="cell out"></div>';continue;}
        var e=EV[dk], pg=isProg(dk), lt=lateOn(dk);
        var cls="cell"+(i>=5?" we":"")+(dk===todayKey?" tod":"")+(e?" ex k-"+e.kind:"")+(pg?" prog":"")+
                (dk<todayKey?(lt?" late":" past"):"");
        var arr=itemsOf(dk),lines="",shown=0,skipped=0,cap=(e||pg||lt)?2:3;
        for(j=0;j<arr.length;j++){
          if(state.filter&&arr[j].s!==state.filter)continue;
          if(shown>=cap){skipped++;continue;}
          lines+='<span class="ci'+(arr[j].done?" done":"")+'" style="--c:'+SM[arr[j].s].c+'">'+esc(arr[j].t)+'</span>';
          shown++;
        }
        if(skipped)lines+='<span class="more">＋'+skipped+'</span>';
        html+='<button class="'+cls+'" data-d="'+dk+'" data-act="open"><span class="n">'+cd.getDate()+'</span>'+
              '<span class="dcs">'+dcLabel(dk)+'</span>'+(e?'<span class="evb">'+e.short+'</span>':"")+
              (lt?'<span class="lateN">未完成 '+lt+'</span>':"")+
              (pg?'<span class="progtag">段考進度</span>':"")+lines+'</button>';
      }
      html+="</div>";
      d=addDays(d,7);
    }
    html+="</div></section>";
  }
  return html;
}

function gotoDay(dk,smooth){
  var el=document.querySelector('[data-d="'+dk+'"]');
  if(!el)return false;
  try{el.scrollIntoView({block:"center",behavior:smooth?"smooth":"auto"});}
  catch(e){el.scrollIntoView();}
  return true;
}
// 開啟時把今天捲到畫面中間。月曆檢視的今天在格子裡，清單檢視在日列上，兩邊都有 data-d。
function centerToday(smooth){
  if(state.view==="late")return;       // 未完成檢視從頂端看起，不捲
  if(!gotoDay(todayKey,smooth)){
    // 今天不在範圍內（計畫還沒開始或已結束）就靠最近的一天
    var keys=Object.keys(state.days).sort(),i,best=null;
    for(i=0;i<keys.length;i++){ if(keys[i]<=todayKey)best=keys[i]; else if(!best){best=keys[i];break;} }
    if(best)gotoDay(best,smooth);
  }
  updateFab();
  // 平滑捲動要一點時間才到位；有些情況（App 剛從背景切回來）動畫不會跑，所以時間到了還沒到位就直接對準
  if(smooth)setTimeout(function(){
    var el=document.querySelector('#main [data-d="'+todayKey+'"]');
    if(el){
      var r=el.getBoundingClientRect(),vh=window.innerHeight||0;
      if(vh&&Math.abs(r.top+r.height/2-vh/2)>vh*0.25)gotoDay(todayKey,false);
    }
    updateFab();
  },650);
}

/* ---------- editor ---------- */
var edPick="en";
var ed=document.getElementById("ed"), scrim=document.getElementById("scrim");
var edInput=document.getElementById("edInput");

function buildPicker(){
  var p=document.getElementById("picker");
  p.innerHTML="";
  SUBJ.forEach(function(s){
    var b=document.createElement("button");
    b.className="pk";b.textContent=s.n;b.style.setProperty("--c",s.c);
    b.setAttribute("aria-pressed",edPick===s.k?"true":"false");
    b.title=s.full;
    b.onclick=function(){edPick=s.k;buildPicker();edInput.focus();};
    p.appendChild(b);
  });
}
function buildWsel(){
  var box=document.getElementById("wsel");
  box.innerHTML='<span class="lb">本週型態</span>';
  WTYPES.forEach(function(w){
    var b=document.createElement("button");
    b.textContent=w[1];
    b.setAttribute("aria-pressed",state.open&&wtypeOf(state.open)===w[0]?"true":"false");
    b.onclick=function(){
      if(!state.open)return;
      state.weeks[weekKey(state.open)]=w[0];
      touch("__weeks");buildWsel();renderBody();
    };
    box.appendChild(b);
  });
}
function openDay(dk){
  if(!inRange(dk))return;
  state.open=dk;
  var d=D(dk), e=EV[dk];
  document.getElementById("edDate").innerHTML=(d.getMonth()+1)+" 月 "+d.getDate()+" 日　週"+WD[col(d)]+
    (e?'<span class="evtag k-'+e.kind+'">'+e.full+(e.of>1?" 第"+e.part+"天":"")+'</span>':"");
  document.getElementById("edSub").textContent=dcLabel(dk)+"　W"+weekNo(weekKey(dk));
  ed.classList.add("on");ed.setAttribute("aria-hidden","false");scrim.classList.add("on");
  buildWsel();buildPicker();renderEdList();
  edInput.value="";
  setTimeout(function(){edInput.focus();},60);
}
function closeEd(){
  state.open=null;
  ed.classList.remove("on");ed.setAttribute("aria-hidden","true");scrim.classList.remove("on");
}
function renderEdList(){
  var box=document.getElementById("edList");
  box.innerHTML="";
  if(!state.open)return;
  var arr=itemsOf(state.open);
  if(!arr.length){
    box.innerHTML='<div class="empty-note">還沒排。<br>粗一點沒關係——一天兩三件主線就夠，剩下的當天再說。</div>';
    return;
  }
  arr.forEach(function(it){
    var r=document.createElement("div");
    r.className="row"+(it.done?" done":"");
    r.style.setProperty("--c",SM[it.s].c);
    r.innerHTML='<button class="tick" title="完成"></button><span class="tag">'+SM[it.s].n+
                '</span><span class="tx">'+esc(it.t)+'</span><button class="del" title="刪除">✕</button>';
    r.querySelector(".tick").onclick=function(){
      it.done=!it.done;touch(monthOf(state.open));renderEdList();renderBody();renderHead();
    };
    r.querySelector(".del").onclick=function(){
      var dk=state.open;
      state.days[dk]=(state.days[dk]||[]).filter(function(x){return x.id!==it.id;});
      if(!state.days[dk].length)delete state.days[dk];
      touch(monthOf(dk));renderEdList();renderBody();renderHead();renderChips();
    };
    box.appendChild(r);
  });
}
function addItem(){
  var t=edInput.value.trim();
  if(!t||!state.open)return;
  if(!state.days[state.open])state.days[state.open]=[];
  state.days[state.open].push({
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    t:t,s:edPick,done:false
  });
  edInput.value="";
  touch(monthOf(state.open));
  renderEdList();renderBody();renderHead();renderChips();
  edInput.focus();
}
function shiftDay(n){
  if(!state.open)return;
  var nk=key(addDays(D(state.open),n));
  if(inRange(nk))openDay(nk);
}

/* ---------- events ---------- */
document.getElementById("main").addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el)return;
  var dk=el.getAttribute("data-d");
  if(el.getAttribute("data-act")==="open"){openDay(dk);return;}
  var id=el.getAttribute("data-i"), arr=state.days[dk]||[],i;
  for(i=0;i<arr.length;i++)if(arr[i].id===id){
    arr[i].done=!arr[i].done;
    if(state.view==="late")justDone[id]=1;   // 在未完成檢視打勾：先留著，劃掉就好
    break;
  }
  touch(monthOf(dk));renderBody();renderHead();
});
document.getElementById("edAdd").onclick=addItem;
edInput.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addItem();}});
document.getElementById("prevD").onclick=function(){shiftDay(-1);};
document.getElementById("nextD").onclick=function(){shiftDay(1);};
document.getElementById("edClose").onclick=closeEd;
scrim.onclick=closeEd;
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&state.open)closeEd();});
document.getElementById("vlist").onclick=function(){setView("list");};
document.getElementById("vgrid").onclick=function(){setView("grid");};
document.getElementById("vlate").onclick=function(){setView("late");window.scrollTo(0,0);};
function setView(v){
  if(v!=="list"&&v!=="grid"&&v!=="late")v="list";
  if(state.view==="late"&&v!=="late")justDone={};   // 離開未完成檢視，剛打勾的收起來
  state.view=v;saveLocal();
  document.getElementById("vlist").setAttribute("aria-pressed",v==="list"?"true":"false");
  document.getElementById("vgrid").setAttribute("aria-pressed",v==="grid"?"true":"false");
  document.getElementById("vlate").setAttribute("aria-pressed",v==="late"?"true":"false");
  renderBody();
  if(v!=="late")centerToday(false);   // 換檢視之後位置會亂掉，重新對準今天
}
document.getElementById("fab").onclick=function(){centerToday(true);};
document.getElementById("fabDate").textContent=md(todayKey)+"（"+WD[col(D(todayKey))]+"）";
// 捲動時更新浮動鈕。不靠 requestAnimationFrame（背景或剛切回來時會暫停），改用時間節流＋收尾補一次
var fabLast=0,fabTrail=null;
window.addEventListener("scroll",function(){
  var now=Date.now();
  if(now-fabLast>80){fabLast=now;updateFab();}
  clearTimeout(fabTrail);
  fabTrail=setTimeout(updateFab,120);
},{passive:true});
window.addEventListener("resize",updateFab);
document.addEventListener("visibilitychange",function(){if(!document.hidden)updateFab();});
window.addEventListener("pageshow",updateFab);

/* ---------- 離線版：內建計畫、版本合併、匯出匯入 ----------
   只有烤了 SEED 的獨立網頁會走這段；artifact 版本沒有 SEED，整段不啟用。 */
var SEEDKEY=LS+"-seed";
function hasSeed(){return typeof SEED!=="undefined"&&SEED&&SEED.days;}
function clone(o){return JSON.parse(JSON.stringify(o));}

function applySeed(){
  if(!hasSeed())return;
  var stored=null;
  try{stored=localStorage.getItem(SEEDKEY);}catch(e){}
  var ver=String(SEED.version||"");

  // 第一次開：整份載入
  if(!Object.keys(state.days).length){
    state.days=clone(SEED.days);
    state.weeks=clone(SEED.weeks||{});
    try{localStorage.setItem(SEEDKEY,ver);}catch(e){}
    saveLocal();
    return;
  }
  // 版本沒變：什麼都不做，用你本機的資料
  if(stored===ver)return;

  // 版本變了：合併。你打的勾照舊，你自己加的項目照舊，計畫項目換成新的。
  // 「自己加的」＝ 沒有 p 記號，而且 id 不在計畫裡。
  // （光看 p 記號不夠：更早的版本沒蓋這個記號，會把整份計畫誤判成自己加的而重複一份。）
  var seedIds={},dk,i,j;
  for(dk in SEED.days)if(SEED.days.hasOwnProperty(dk))
    for(j=0;j<SEED.days[dk].length;j++)seedIds[SEED.days[dk][j].id]=1;

  var doneIds={},mine={};
  for(dk in state.days)if(state.days.hasOwnProperty(dk)){
    var own=[];
    for(i=0;i<state.days[dk].length;i++){
      var it=state.days[dk][i];
      if(it.done)doneIds[it.id]=1;
      if(!it.p&&!seedIds[it.id])own.push(it);
    }
    if(own.length)mine[dk]=own;
  }
  var next={},added=0,kept=0;
  for(dk in SEED.days)if(SEED.days.hasOwnProperty(dk)){
    next[dk]=SEED.days[dk].map(function(x){
      var c=clone(x);
      if(doneIds[c.id]){c.done=true;kept++;}
      return c;
    });
    added+=next[dk].length;
  }
  for(dk in mine)if(mine.hasOwnProperty(dk)){
    next[dk]=(next[dk]||[]).concat(mine[dk]);
  }
  for(var wk in (SEED.weeks||{}))if(!(wk in state.weeks))state.weeks[wk]=SEED.weeks[wk];
  state.days=next;
  try{localStorage.setItem(SEEDKEY,ver);}catch(e){}
  saveLocal();
  setStatus("計畫已更新（"+added+" 項），你打的 "+kept+" 個勾保留了");
}

function initTools(){
  if(!hasSeed())return;
  var f=document.getElementById("tools");
  f.hidden=false;
  var info=document.getElementById("seedInfo");
  info.textContent="計畫版本 "+(SEED.version||"—")+"　進度存在這個瀏覽器裡";

  document.getElementById("btnExp").onclick=function(){
    var blob=new Blob([JSON.stringify({
      kind:"shutong-plan",version:SEED.version,exportedAt:new Date().toISOString(),
      days:state.days,weeks:state.weeks
    },null,1)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="學測進度-"+todayKey+".json";
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
  };

  var fi=document.getElementById("fileImp");
  document.getElementById("btnImp").onclick=function(){fi.click();};
  fi.onchange=function(){
    var file=fi.files&&fi.files[0];
    if(!file)return;
    var r=new FileReader();
    r.onload=function(){
      var o;
      try{o=JSON.parse(r.result);}catch(e){setStatus("這個檔案讀不了，要 匯出進度 存出來的 JSON");fi.value="";return;}
      if(!o||!o.days){setStatus("檔案內容不對，找不到進度資料");fi.value="";return;}
      var n=0,k;
      for(k in o.days)if(o.days.hasOwnProperty(k))n+=o.days[k].length;
      if(!confirm("要用這個檔案取代目前的進度嗎？\n\n檔案裡有 "+n+" 項"+
                  (o.exportedAt?"，匯出於 "+o.exportedAt.slice(0,10):"")+"。\n目前這台裝置上的進度會被覆蓋。")){
        fi.value="";return;
      }
      state.days=o.days;state.weeks=o.weeks||{};
      saveLocal();
      renderHead();renderChips();renderBody();
      setStatus("匯入完成，"+n+" 項");
      fi.value="";
    };
    r.readAsText(file);
  };
}

/* ---------- boot ---------- */
try{if("scrollRestoration" in history)history.scrollRestoration="manual";}catch(e){}
loadLocal();
applySeed();
renderHead();renderExams();renderChips();setView(state.view);
initTools();
// 字型載入完、版面高度才定案，所以再對一次
centerToday(false);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){centerToday(false);});
window.addEventListener("load",function(){centerToday(false);});

if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("db").then(function(x){
    if(!x)return;
    db=x;
    MONTHS.forEach(function(m){
      var mk=m[0];
      db.doc("plan/"+mk).onSnapshot(function(s){
        if(!s.exists){
          if(Object.keys(daysOfMonth(mk)).length)touch(mk);
          return;
        }
        var incoming=(s.data()||{}).days||{},k;
        for(k in state.days)if(state.days.hasOwnProperty(k)&&k.slice(0,7)===mk)delete state.days[k];
        for(k in incoming)if(incoming.hasOwnProperty(k))state.days[k]=JSON.parse(JSON.stringify(incoming[k]));
        saveLocal();renderHead();renderChips();renderBody();
        if(state.open&&monthOf(state.open)===mk)renderEdList();
      },function(){setStatus("雲端同步中斷，改用本機儲存");});
    });
    db.doc("plan/weeks").onSnapshot(function(s){
      if(!s.exists){if(Object.keys(state.weeks).length)touch("__weeks");return;}
      state.weeks=(s.data()||{}).weeks||{};
      saveLocal();renderBody();
      if(state.open)buildWsel();
    },function(){});
  })["catch"](function(){});
}
})();
